services:
  erp-backend:
    build:
      context: ./erp-express
      dockerfile: Dockerfile
    container_name: erp-backend
    restart: unless-stopped
    ports:
      - "5656:5656"
    environment:
      - PORT=5656
      - DATABASE_URL=mysql://root:@host.docker.internal:3306/db_ims_epu
      - DB_HOST=host.docker.internal
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=
      - DB_NAME=db_ims_epu
      - JWT_SECRET=secret_key_budgeting_express_2026
    extra_hosts:
      - "host.docker.internal:host-gateway"

  erp-frontend:
    build:
      context: ./erp-next
      dockerfile: Dockerfile
    container_name: erp-frontend
    restart: unless-stopped
    ports:
      - "5555:5555"
    environment:
      - PORT=5555
      - INTERNAL_BACKEND_URL=http://erp-backend:5656
    depends_on:
      - erp-backend
