services:
  erp-backend:
    build:
      context: ./erp-express
      dockerfile: Dockerfile
    container_name: erp-backend
    restart: unless-stopped
    ports:
      - "2121:2121"
    environment:
      - PORT=2121
      - DATABASE_URL=mysql://root:@host.docker.internal:3306/db_ims_epu
      - DB_HOST=host.docker.internal
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=
      - DB_NAME=db_ims_epu
      - JWT_SECRET=secret_key_erp_express_2026
    extra_hosts:
      - "host.docker.internal:host-gateway"

  erp-frontend:
    build:
      context: ./erp-next
      dockerfile: Dockerfile
    container_name: erp-frontend
    restart: unless-stopped
    ports:
      - "1212:1212"
    environment:
      - PORT=1212
      - INTERNAL_BACKEND_URL=http://erp-backend:2121
    depends_on:
      - erp-backend
